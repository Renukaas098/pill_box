<div class="card">

<h2>Available Devices</h2>

<button class="primary" onclick="loadDevices()">
Refresh Devices
</button>

<div id="device-list" class="device-grid"></div>

</div>

<div class="card">

<h2>WiFi Setup</h2>

<label>Selected Device IP</label>
<input id="device-ip" readonly>

<label>WiFi Network</label>
<select id="wifi-list"></select>

<label>Password</label>
<input id="wifi-pass" type="password">

<button class="primary" onclick="scanWifiNetworks()">
Scan WiFi
</button>

<button class="primary" onclick="connectDevice()">
Connect Device
</button>

</div>
