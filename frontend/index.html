<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Face Recognition Dashboard</title>

<link rel="stylesheet" href="/frontend/css/dashboard.css">

<script src="/frontend/js/api.js"></script>
<script src="/frontend/js/device.js"></script>
<script src="/frontend/js/recognition.js"></script>

</head>

<body>

<div id="navbar"></div>

<div class="layout">

<div id="sidebar"></div>

<div id="page-content" class="page-content"></div>

</div>

<script>

async function loadComponent(id,path){

try{

const res = await fetch(path)

if(!res.ok) throw new Error("Failed to load component")

const html = await res.text()

document.getElementById(id).innerHTML = html

}catch(err){

console.error(err)

}

}

async function loadPage(page){

try{

const res = await fetch(`/frontend/pages/${page}.html`)

if(!res.ok) throw new Error("Page load failed")

const html = await res.text()

document.getElementById("page-content").innerHTML = html

initializePage(page)

}catch(err){

console.error(err)

}

}

function initializePage(page){

if(page === "device_setup"){

if(typeof loadDevices === "function"){
loadDevices()
}

}

if(page === "live_recognition"){

if(typeof startStream === "function"){
startStream()
}

if(typeof loadUsers === "function"){
loadUsers()
}

}

if(page === "logs"){

if(typeof fetchRecognitionLogs === "function"){
fetchRecognitionLogs()
}

}

}

async function init(){

await loadComponent("navbar","/frontend/components/navbar.html")

await loadComponent("sidebar","/frontend/components/sidebar.html")

loadPage("device_setup")

}

init()

</script>

</body>
</html>
